name: Auto enrich Qidian work dates

on:
  push:
    branches: [main]
    paths: [.github/workflows/webnovel-auto-qidian-detail.yml]
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: webnovel-structured-database-v04
          run-id: '35320781239'
          github-token: ${{ github.token }}
          path: baseline

      - name: Select deterministic ID block
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import time, math
          n=3345; batch=50
          day=int(time.time()//86400)
          block=day%math.ceil(n/batch)
          print('offset='+str(block*batch))
          print('block_id='+str(block))
          PY

      - name: Enrich from public mobile work and chapter catalog pages
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5'
          python -m py_compile projects/webnovel_stratification/code/collect_qidian_api_metadata.py
          python projects/webnovel_stratification/code/collect_qidian_api_metadata.py \
            --baseline baseline \
            --out qidian-detail-auto \
            --offset "$offset" \
            --limit 50 \
            --delay 3

      - name: Pack and persist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date -u +%Y%m%d)
          asset="qidian-detail-${stamp}-block${block_id}.tar.gz"
          tar -czf "$asset" qidian-detail-auto
          gh release view webnovel-harvest >/dev/null 2>&1 || \
            gh release create webnovel-harvest --title 'Webnovel harvest batches' --notes 'Automated public metadata batches; no novel prose.' || true
          gh release upload webnovel-harvest "$asset" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qidian-detail-${{ github.run_id }}
          path: qidian-detail-auto/
          retention-days: 90
          if-no-files-found: error
