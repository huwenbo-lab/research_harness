name: Catalog and date evidence v04
on:
  push:
    branches: [project/webnovel-stratification-pilot]
    paths: [.github/workflows/webnovel-catalog-dates-v04.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acquire:
    strategy:
      fail-fast: false
      matrix:
        mode: [jjwxc, repositories]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: matrix.mode == 'jjwxc'
        with:
          name: webnovel-structured-database-v03
          run-id: '35316738666'
          github-token: ${{ github.token }}
          path: baseline
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate syntax and acquire inert public metadata
        run: |
          python -m py_compile projects/webnovel_stratification/code/recover_catalog_dates_v04.py
          python projects/webnovel_stratification/code/recover_catalog_dates_v04.py '${{ matrix.mode }}' --baseline baseline --out 'v04-${{ matrix.mode }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: webnovel-v04-${{ matrix.mode }}
          path: v04-${{ matrix.mode }}/
          retention-days: 30
          if-no-files-found: error
