name: Daily bounded JJWXC detail metadata harvest

# Historical entry point; automatic collection uses webnovel-daily-scheduler.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jjwxc-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: webnovel-structured-database-v04
          run-id: '35320781239'
          github-token: ${{ github.token }}
          path: baseline

      - name: Install parser dependency
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5'
          python -m py_compile projects/webnovel_stratification/code/date_parser_v04.py
          python -m py_compile projects/webnovel_stratification/code/collect_jjwxc_public_metadata.py

      - name: Collect one bounded metadata batch
        shell: bash
        run: |
          DAY_INDEX="$(( $(date -u +%s) / 86400 ))"
          OFFSET="$(( DAY_INDEX * 100 ))"
          echo "offset=$OFFSET" >> "$GITHUB_ENV"
          python projects/webnovel_stratification/code/collect_jjwxc_public_metadata.py \
            --baseline baseline \
            --out jjwxc-detail-cloud \
            --offset "$OFFSET" \
            --limit 100

      - name: Upload structured metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jjwxc-detail-metadata-${{ github.run_id }}-${{ env.offset }}
          path: jjwxc-detail-cloud/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
