name: Webnovel daily metadata scheduler

on:
  push:
    branches: [main]
    paths: [.github/workflows/webnovel-daily-scheduler.yml]
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: webnovel-daily-metadata
  cancel-in-progress: false

jobs:
  jjwxc-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Harvest one bounded JJWXC catalog batch
        shell: bash
        run: |
          RUN_DAY="$(date -u +%Y%m%d)"
          DAY_INDEX="$(( $(date -u +%s) / 86400 ))"
          YEAR="$(( 2005 + (DAY_INDEX % 21) ))"
          echo "year=$YEAR" >> "$GITHUB_ENV"
          python projects/webnovel_stratification/code/collect_catalog.py \
            --out "jjwxc-catalog" \
            --start "$YEAR" --end "$YEAR" \
            --pages-per-year 5 --seed "$RUN_DAY" --delay 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jjwxc-catalog-${{ github.run_id }}-${{ env.year }}
          path: jjwxc-catalog/
          retention-days: 90
          if-no-files-found: error

  jjwxc-detail:
    needs: jjwxc-catalog
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: webnovel-structured-database-v04
          run-id: '35320781239'
          github-token: ${{ github.token }}
          path: baseline
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Harvest JJWXC public work/chapter metadata
        shell: bash
        run: |
          DAY_INDEX="$(( $(date -u +%s) / 86400 ))"
          OFFSET="$(( DAY_INDEX * 100 ))"
          echo "offset=$OFFSET" >> "$GITHUB_ENV"
          python projects/webnovel_stratification/code/collect_jjwxc_public_metadata.py \
            --baseline baseline --out jjwxc-detail --offset "$OFFSET" --limit 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jjwxc-detail-${{ github.run_id }}-${{ env.offset }}
          path: jjwxc-detail/
          retention-days: 90
          if-no-files-found: error

  qidian-metadata:
    needs: jjwxc-detail
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: webnovel-structured-database-v04
          run-id: '35320781239'
          github-token: ${{ github.token }}
          path: baseline
      - name: Harvest Qidian public JSON metadata
        shell: bash
        run: |
          python -m py_compile projects/webnovel_stratification/code/collect_qidian_api_metadata.py
          DAY_INDEX="$(( $(date -u +%s) / 86400 ))"
          OFFSET="$(( DAY_INDEX * 50 ))"
          echo "offset=$OFFSET" >> "$GITHUB_ENV"
          python projects/webnovel_stratification/code/collect_qidian_api_metadata.py \
            --baseline baseline --out qidian-metadata --offset "$OFFSET" --limit 50 --delay 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qidian-metadata-${{ github.run_id }}-${{ env.offset }}
          path: qidian-metadata/
          retention-days: 90
          if-no-files-found: error
