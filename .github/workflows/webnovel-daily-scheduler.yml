name: Durable webnovel metadata collection

# Normal runs require an explicitly bootstrapped, audited cloud-node snapshot.
# The one-time dispatch inputs name two .sqlite.gz assets in this repository's
# fixed webnovel-crawler-bootstrap release; no arbitrary URL or empty init exists.
# Each five-minute Qidian batch is exported, audited, and published before the
# next batch. Assets retain the true run/attempt and add an independent batch ID.
on:
  schedule:
    - cron: '23 3,15 * * *'
  workflow_dispatch:
    inputs:
      bootstrap_source_asset:
        description: 'First start only: cloud snapshot asset in webnovel-crawler-bootstrap'
        required: false
        type: string
        default: ''
      bootstrap_previous_asset:
        description: 'First start only: predecessor snapshot asset in the same staging release'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: webnovel-daily-metadata
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/webnovel_stratification
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install collection dependencies
        run: python -m pip install -r requirements.txt

      - name: Check collection and persistence contracts
        run: |
          python -m unittest discover -s tests -p 'test_crawler*.py'
          python -m unittest discover -s tests -p 'test_cloud_*.py'
          python -m unittest discover -s tests -p 'test_local_service.py'

      - name: Restore and run up to three durable cloud-node batches
        id: cycle
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_SOURCE_ASSET: ${{ inputs.bootstrap_source_asset }}
          BOOTSTRAP_PREVIOUS_ASSET: ${{ inputs.bootstrap_previous_asset }}
        run: |
          python code/cloud_cycle.py --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --target "$GITHUB_SHA" \
            --db state/crawler.sqlite --out out --batches 3 \
            --max-requests 50 --max-seconds 300 \
            --bootstrap-source-asset "$BOOTSTRAP_SOURCE_ASSET" \
            --bootstrap-previous-asset "$BOOTSTRAP_PREVIOUS_ASSET"

      - name: Retain diagnostics for completed, interrupted, and blocked batches
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webnovel-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            projects/webnovel_stratification/out/**/*.json
            projects/webnovel_stratification/state/restored.json
          retention-days: 30
          if-no-files-found: warn
