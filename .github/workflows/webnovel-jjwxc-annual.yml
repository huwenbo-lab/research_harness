name: JJWXC annual catalog audit
on:
  push:
    branches: [project/webnovel-stratification-pilot]
    paths: [.github/workflows/webnovel-jjwxc-annual.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Retrieve and validate year-specific catalog pages
        run: python projects/webnovel_stratification/code/collect_catalog.py --out annual-catalog --start 2005 --end 2025 --pages-per-year 5 --delay 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jjwxc-annual-catalog
          path: annual-catalog/
          retention-days: 30
          if-no-files-found: error
