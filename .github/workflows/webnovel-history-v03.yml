name: Webnovel historical issues v03
on:
  push:
    branches: [project/webnovel-stratification-pilot]
    paths: [.github/workflows/webnovel-history-v03.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [editorial, archives]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - run: python projects/webnovel_stratification/code/recover_history_v03.py '${{ matrix.mode }}' --out 'history-${{ matrix.mode }}'
        env:
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: webnovel-v03-history-${{ matrix.mode }}
          path: history-${{ matrix.mode }}/
          retention-days: 30
          if-no-files-found: error
