name: JJWXC partition harvester probe

on:
  push:
    branches: [project/webnovel-stratification-pilot]
    paths:
      - .github/workflows/webnovel-jjwxc-partition-harvest-probe.yml
      - projects/webnovel_stratification/code/collect_jjwxc_partitioned_catalog.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Run one bounded recursive public cell
        run: |
          python -m py_compile projects/webnovel_stratification/code/collect_jjwxc_partitioned_catalog.py
          python projects/webnovel_stratification/code/collect_jjwxc_partitioned_catalog.py \
            --out jjwxc-partition-harvest \
            --year 2019 --yc 1 --xx 1 --isfinish 2 \
            --max-pages 10 --request-budget 80 --delay 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jjwxc-partition-harvest-probe-${{ github.run_id }}
          path: jjwxc-partition-harvest/
          retention-days: 30
          if-no-files-found: error
