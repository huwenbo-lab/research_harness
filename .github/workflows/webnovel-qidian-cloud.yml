name: Daily bounded Qidian metadata harvest

on:
  push:
    branches: [project/webnovel-stratification-pilot]
    paths:
      - .github/workflows/webnovel-qidian-cloud.yml
      - projects/webnovel_stratification/code/collect_qidian_public_metadata.py
  schedule:
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qidian:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: webnovel-structured-database-v04
          run-id: '35320781239'
          github-token: ${{ github.token }}
          path: baseline

      - name: Install browser collector
        run: |
          python -m pip install 'playwright>=1.52,<2'
          python -m playwright install --with-deps chromium
          python -m py_compile projects/webnovel_stratification/code/collect_qidian_public_metadata.py

      - name: Collect one bounded public metadata batch
        shell: bash
        run: |
          DAY_INDEX="$(( $(date -u +%s) / 86400 ))"
          OFFSET="$(( (DAY_INDEX * 12) % 3345 ))"
          echo "offset=$OFFSET" >> "$GITHUB_ENV"
          python projects/webnovel_stratification/code/collect_qidian_public_metadata.py \
            --baseline baseline \
            --out qidian-cloud \
            --offset "$OFFSET" \
            --limit 12 \
            --wait-ms 2500 \
            --delay-ms 5000

      - name: Upload structured metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidian-public-metadata-${{ github.run_id }}-${{ env.offset }}
          path: qidian-cloud/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
