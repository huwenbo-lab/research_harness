name: Daily bounded Qidian metadata harvest

on:
  push:
    branches: [project/webnovel-stratification-pilot]
    paths:
      - .github/workflows/webnovel-qidian-cloud.yml
      - projects/webnovel_stratification/code/collect_qidian_api_metadata.py
  schedule:
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qidian:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/webnovel-stratification-pilot
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: webnovel-structured-database-v04
          run-id: '35320781239'
          github-token: ${{ github.token }}
          path: baseline

      - name: Validate collector
        run: python -m py_compile projects/webnovel_stratification/code/collect_qidian_api_metadata.py

      - name: Collect one bounded public JSON metadata batch
        shell: bash
        run: |
          DAY_INDEX="$(( $(date -u +%s) / 86400 ))"
          OFFSET="$(( DAY_INDEX * 50 ))"
          LIMIT=50
          DELAY=3
          if [ "${{ github.event_name }}" = "push" ]; then LIMIT=2; DELAY=2; fi
          echo "offset=$OFFSET" >> "$GITHUB_ENV"
          echo "limit=$LIMIT" >> "$GITHUB_ENV"
          python projects/webnovel_stratification/code/collect_qidian_api_metadata.py \
            --baseline baseline \
            --out qidian-cloud \
            --offset "$OFFSET" \
            --limit "$LIMIT" \
            --delay "$DELAY"

      - name: Upload structured metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidian-public-metadata-${{ github.run_id }}-${{ env.offset }}
          path: qidian-cloud/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
